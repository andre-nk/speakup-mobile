name: speakup_final
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.11.0
  google_fonts: ^6.2.1
  flutter_i18n: ^0.36.2
  logger: ^2.5.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_svg: ^2.1.0
  igris: ^0.0.1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  google_sign_in: ^6.3.0
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  flutter_sanity_portable_text: ^1.6.2
  sanity_client: ^1.8.4
  audio_waveforms: ^1.3.0
  permission_handler: ^12.0.0+1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  http: ^1.3.0
  http_parser: ^4.1.2
  path: ^1.9.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher/launcher_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/splash_icon.png
  branding: assets/splash/splash_icon.png
  color_dark: "#FFFFFF"
  image_dark: assets/splash/splash_icon.png
  branding_dark: assets/splash/splash_icon.png

  android_12:
    image: assets/splash/splash_icon.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/splash/splash_icon.png
    icon_background_color_dark: "#FFFFFF"

  web: false

  android: true
  ios: false

  fullscreen: false

  info_plist_files:
    - "ios/Runner/Info-Release.plist"
    - "ios/Runner/Info-Debug.plist"

  # Configure text
  android_gravity: center
  ios_content_mode: center
  web_image_mode: center

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/i18n/
